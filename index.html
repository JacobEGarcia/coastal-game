<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coastal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐚</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2ecdc;color:#1e3a52;font-family:"Inter",-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:38px;font-weight:600}
.sub{color:#8a8672;font-size:11px;letter-spacing:.16em;margin-top:8px;text-transform:uppercase}
#coast{width:min(600px,96vw);height:340px;margin:22px 0;border:1px solid #1e3a52;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#7faeba 0 55%,#dcc89a 55% 62%,#c2a878 62%);box-shadow:0 12px 30px rgba(30,58,82,.16)}
#wave{position:absolute;left:0;right:0;top:52%;font-size:20px;letter-spacing:-2px;white-space:nowrap;overflow:hidden;opacity:.55;color:#fff}
#you{position:absolute;font-size:36px;top:64%;left:44%;transition:left .15s,top .15s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.shell{position:absolute;font-size:22px;cursor:pointer;transition:transform .1s}
.shell:hover{transform:scale(1.4)}
#hud{font-size:11.5px;color:#8a8672;letter-spacing:.08em;text-align:center;line-height:2;text-transform:uppercase}
#hud b{color:#1e3a52;font-weight:600}
#msg{margin-top:12px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:15px;color:#6f6a58;min-height:18px;text-align:center}
</style>
</head>
<body>
<h1>Coastal</h1>
<div class="sub">walk the tide line &middot; collect what the sea gives</div>
<div id="coast">
  <div id="wave">～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～</div>
  <div id="you">&#128694;</div>
</div>
<div id="hud">Shells <b id="shells">0</b> &middot; Sea glass <b id="glass">0</b> &middot; Mystery items <b id="myst">0</b></div>
<div id="msg">click what washes up. the tide provides on its own schedule.</div>
<script>
const $=id=>document.getElementById(id);
const coast=$('coast');
let shells=0,glass=0,myst=0;
const FINDS=[['🐚','shell',.5],['🫙','glass',.25],['🦀','mystery',.1],['⭐','mystery',.08],['🗝️','mystery',.04],['💎','mystery',.03]];
const NOTES={shell:'a shell, still humming',glass:'sea glass, smoothed by patience',mystery:'the sea has questions. you have this now.'};
setInterval(()=>{
  if(document.querySelectorAll('.shell').length>6)return;
  let r=Math.random(),pick=FINDS[0],acc=0;
  for(const f of FINDS){acc+=f[2];if(r<acc){pick=f;break;}}
  const el=document.createElement('div');el.className='shell';el.textContent=pick[0];
  el.style.left=(5+Math.random()*88)+'%';el.style.top=(64+Math.random()*28)+'%';
  el.onclick=()=>{
    if(pick[1]==='shell'){shells++;$('shells').textContent=shells;}
    else if(pick[1]==='glass'){glass++;$('glass').textContent=glass;}
    else{myst++;$('myst').textContent=myst;}
    $('msg').textContent=NOTES[pick[1]];
    el.style.transform='scale(0)';setTimeout(()=>el.remove(),150);
    if(shells+glass+myst===20)$('msg').textContent='TWENTY TREASURES. The tide nods. You are coastal now.';
  };
  coast.appendChild(el);
  setTimeout(()=>{if(el.parentNode)el.style.opacity='0.3';},8000);
  setTimeout(()=>el.remove(),12000);
},1500);
/* wander */
let x=44,y=64;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')x=Math.max(2,x-4);
  if(e.key==='ArrowRight')x=Math.min(92,x+4);
  if(e.key==='ArrowUp')y=Math.max(60,y-3);
  if(e.key==='ArrowDown')y=Math.min(90,y+3);
  $('you').style.left=x+'%';$('you').style.top=y+'%';
});
</script>
</body>
</html>
